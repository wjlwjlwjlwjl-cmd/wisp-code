server:
  port: 18080

spring:
  application:
    name: nexus-gateway
  profiles:
    active: ${RUN_ENV}
  cloud:
    nacos:
      discovery:
        username: nacos
        password: bite@123
        namespace: frameworkjava-${RUN_ENV}
        server-addr: ${NACOS_ADDR}
      config:
        username: nacos
        password: bite@123
        namespace: frameworkjava-${RUN_ENV}
        server-addr: ${NACOS_ADDR}
        file-extension: yaml
      shared-configs:
        - data-id: share-common-${RUN_ENV}.yaml
          group: DEFAULT_GROUP
        - data-id: share-redis-${RUN_ENV}.yaml
          group: DEFAULT_GROUP
        - data-id: share-mysql-${RUN_ENV}.yaml
          group: DEFAULT_GROUP
        - data-id: share-rabbitmq-${RUN_ENV}.yaml
          group: DEFAULT_GROUP
        - data-id: share-caffeine-${RUN_ENV}.yaml
          group: DEFAULT_GROUP