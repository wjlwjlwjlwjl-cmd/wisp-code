#启动命令 docker compose -p nexus-stack -f docker-compose-mid.yml up -d
services:
  frameworkjava-mysql:
    container_name: frameworkjava-mysql
    image: mysql:8.4.2
    ports:
      - "3306:3306"
    volumes:
      # 数据挂载
      - ../data/frameworkjavadata/mysql/data:/var/lib/mysql
      # 配置挂载
      # - ./mysql/sql:/opt/sql
      # - ./mysql/init/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./mysql/sql:/docker-entrypoint-initdb.d
    command: [
      'mysqld',
      '--innodb-buffer-pool-size=80M',
      '--character-set-server=utf8mb4',
      '--collation-server=utf8mb4_unicode_ci',
      '--default-time-zone=+8:00',
      '--lower-case-table-names=1',
      '--explicit_defaults_for_timestamp=true',
      '--server-id=1',
      '--log-bin=mysql-bin',
      '--binlog-ignore-db=mysql',
      '--binlog-cache-size=256M',
      '--binlog-format=ROW',
      '--max_connections=2000'
    ]
    restart: always
    networks:
      - frameworkjava_network
    healthcheck:
      test: mysql --user=bitedev -h127.0.0.1 --password='bite@123' -e "SELECT 1;"
      start_period: 180s
      interval: 5s
      timeout: 5s
      retries: 12
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: bite@123
    ulimits:
      nproc: 65535
      nofile:
        soft: 20000
        hard: 40000
  frameworkjava-nacos:
    container_name: frameworkjava-nacos
    image: nacos/nacos-server:v2.2.2
    environment:
      - MODE=standalone
      - JVM_XMS=512m
      - JVM_XMX=512m
      - JVM_XMN=256m
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=frameworkjava-mysql
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_DB_NAME=frameworkjava_nacos_test
      - MYSQL_SERVICE_USER=bitedev
      - MYSQL_SERVICE_PASSWORD=bite@123
    volumes:
      - ../data/frameworkjavadata/nacos/logs/:/home/nacos/logs
      - ../data/frameworkjavadata/nacos/tomcatlogs/:/home/bit/nacos/tomcat/logs/
      - ./nacos/conf/application.properties:/home/nacos/conf/application.properties
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    restart: always
    networks:
      - frameworkjava_network
    depends_on:
      frameworkjava-mysql:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8848/nacos" ]
      start_period: 30s
      interval: 10s
      timeout: 10s
      retries: 10
  frameworkjava-redis:
    container_name: frameworkjava-redis
    image: redis:7.0.15
    ports:
      - "6379:6379"
    volumes:
      - ./redis/conf/redis.conf:/usr/local/etc/redis/redis.conf
      - ../data/frameworkjavadata/redis/data:/data
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: always
    networks:
      - frameworkjava_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
  frameworkjava-rabbitmq:
    image: rabbitmq:3.12.6-management
    container_name: frameworkjava-rabbitmq
    restart: always
    hostname: frameworkjava-rabbitmq
    environment:
      # 用户名
      RABBITMQ_DEFAULT_USER: admin
      # 密码
      RABBITMQ_DEFAULT_PASS: bite@123
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ../data/frameworkjavadata/rabbitmq/log:/var/log/rabbitmq
      - ../data/frameworkjavadata/rabbitmq/data:/var/lib/rabbitmq
    networks:
      - frameworkjava_network
    healthcheck:
      test: [ "CMD", "rabbitmqctl", "status" ]
      interval: 10s
      timeout: 10s
      retries: 10

  wispcode-userapp-preview:
    container_name: wispcode-userapp-preview
    image: wispcode/userapp
    build:
      dockerfile: ./userapp/preview/Dockerfile
    volumes:
      - ../data/wispcodedata/userapp/preview:/workspace/user-preview
      - ./userapp/preview/nginx/scripts:/workspace/scripts
      - ./userapp/preview/nginx/conf/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    restart: always
    networks:
      - frameworkjava_network

  wispcode-web:
    image: nginx:1.24.0
    container_name: wispcode-web
    restart: always
    networks:
      - frameworkjava_network
    ports:
      - "19080:19080"
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/web/dist:/data/flashcode/web/dist
    ulimits:
      nproc: 65535
      nofile:
        soft: 20000
        hard: 40000
  etcd:
    container_name: wispcode-milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ../data/wispcodedata/milvus/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: wispcode-milvus-minio
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ../data/wispcodedata/milvus/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: wispcode-milvus-standalone
    image: milvusdb/milvus:v2.6.4
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - ../data/wispcodedata/milvus/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"
        
  bge-m3-embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    ports:
      - "8090:80"
    volumes:
      - ./hf_model_cache:/data
    environment:
      - HF_HUB_ENABLE_HF_TRANSFER=1
    command: >
      --model-id BAAI/bge-m3
      --dtype float32
      --pooling mean
      --max-batch-tokens 4096
      --max-batch-requests 4
      --max-client-batch-size 4
      --max-concurrent-requests 2
      --auto-truncate

networks:
  frameworkjava_network:
