spring:
  application:
    name: wisp-code
  profiles:
    active: ${RUN_ENV}
  main:
    web-application-type: reactive
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: deepseek-v4-pro-0813
          temperature: 0.7
    # -------- TEI bge‑m3 embedding（OpenAI兼容端点） --------
    openai:
      base-url: http://192.168.160.131:8090/v1
      api-key: dummy-tei
      chat:
        enabled: false # TEI没有chat接口，关闭chat自动配置，只使用embedding
    # -------- Milvus向量存储，启用 --------
    vectorstore:
      milvus:
        enabled: true
        client:
          host: 192.168.160.131
          port: 19530
        collection-name: RAG
        embedding-dimension: 1024
        initialize-schema: true
        index-type: HNSW
        metric-type: COSINE

management:
  health:
    redis:
      enabled: false