server:
  port: 18084
  tomcat:
    max-query-size: 102400
    max-query-string-length: 102400

spring:
  application:
    name: wisp-code
  profiles:
    active: ${RUN_ENV}
  main:
    web-application-type: reactive
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      region-id: cn-beijing
      chat:
        options:
          model: qwen3.7-max

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://frameworkjava-mysql:3306/wispcode?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: bitedev
    password: bite@123

  cloud:
    nacos:
      discovery:
        username: nacos
        password: bite@123
        namespace: frameworkjava-${RUN_ENV}
        server-addr: ${NACOS_ADDR}
      config:
        username: nacos
        password: bite@123
        namespace: frameworkjava-${RUN_ENV}
        server-addr: ${NACOS_ADDR}
        file-extension: yaml
        # 共享配置
        shared-configs:
          - data-id: share-common-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
            refresh: true
          - data-id: share-redis-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
            refresh: true
          - data-id: share-mysql-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
            refresh: true
          - data-id: share-rabbitmq-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
            refresh: true
          - data-id: share-caffeine-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
            refresh: true
