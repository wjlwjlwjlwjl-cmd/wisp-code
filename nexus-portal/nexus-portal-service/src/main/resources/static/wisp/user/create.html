<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>生成应用 · WispCode</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('wisp_theme')==='light'?'light':'dark'}catch(e){}</script>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div id="nav-mount"></div>
<div class="wrap">
  <div class="page-title">生成应用</div>
  <p class="page-sub">描述你的需求 → 生成应用文档 → 选择构建方式生成可预览的应用。</p>

  <div class="steps" id="steps">
    <div class="step active" data-s="1"><span class="dot">1</span> 需求文档</div>
    <div class="step" data-s="2"><span class="dot">2</span> 生成代码</div>
    <div class="step" data-s="3"><span class="dot">3</span> 构建结果</div>
  </div>

  <div id="alert" class="alert"></div>

  <!-- STEP 1 -->
  <div class="card" id="panel-1">
    <h3>① 描述你的应用需求</h3>
    <p class="hint">用自然语言描述，AI 会生成结构化应用文档（可编辑）。</p>
    <div class="field">
      <textarea id="req-input" placeholder="例如：做一个待办事项应用，支持添加、勾选完成、按日期分类和删除，界面简洁现代。"></textarea>
    </div>
    <button class="btn" id="btn-gen-doc" onclick="genDoc()"><svg class="ic" viewBox="0 0 24 24"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/></svg>生成应用文档</button>
  </div>

  <!-- STEP 2 -->
  <div class="card" id="panel-2" style="display:none">
    <h3>② 确认应用文档并选择构建方式</h3>
    <p class="hint">应用文档 <span class="badge" id="appid-badge">appId: —</span> 可在“编辑”中修改，“预览”为 Markdown 渲染效果。</p>
    <div class="field"><label>应用文档</label>
      <div class="md-tabs">
        <button id="doc-tab-edit" onclick="switchDocTab('edit')"><svg class="ic" viewBox="0 0 24 24"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>编辑</button>
        <button class="active" id="doc-tab-preview" onclick="switchDocTab('preview')"><svg class="ic" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>预览</button>
      </div>
      <textarea id="app-doc" style="display:none" oninput="renderDocPreview()"></textarea>
      <div class="md-body" id="doc-preview"></div>
    </div>
    <div class="field"><label>构建方式</label>
      <div class="grid cols-2 mt-8">
        <label class="card choice">
          <input type="radio" name="mode" value="normal" checked>
          <span><b>普通构建</b><br><span class="muted">单流程生成，速度快</span></span>
        </label>
        <label class="card choice">
          <input type="radio" name="mode" value="agent">
          <span><b>多 Agent 构建</b><br><span class="muted">多智能体协作，质量更高</span></span>
        </label>
      </div>
    </div>
    <div class="row">
      <button class="btn ghost" onclick="backTo(1)"><svg class="ic" viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>上一步</button>
      <button class="btn" id="btn-gen-app" onclick="genApp()"><svg class="ic" viewBox="0 0 24 24"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>开始生成应用</button>
    </div>
  </div>

  <!-- STEP 3 -->
  <div class="card" id="panel-3" style="display:none">
    <h3>③ 构建完成</h3>
    <p class="hint">应用已生成，可预览、迭代修改或部署。</p>
    <div class="kv" id="result-kv"></div>
    <hr class="sep">
    <label>预览</label>
    <iframe id="preview" class="preview-frame" src="about:blank"></iframe>
    <div class="btn-row mt-16">
      <a class="btn ghost" id="open-tab" href="#" target="_blank" rel="noopener"><svg class="ic" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/></svg>新窗口打开</a>
      <a class="btn" id="to-detail" href="#">进入应用（修改/部署）</a>
      <button class="btn ghost" onclick="resetAll()"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>再创建一个</button>
    </div>
  </div>
</div>

<script src="assets/markdown.js"></script>
<script src="assets/api.js"></script>
<script>
  const A=WispAPI.api,Auth=WispAPI.auth,nav=WispAPI.nav,esc=WispAPI.escape;
  if(!Auth.require()){} nav('create');
  let state={appId:null,previewUrl:null,appType:null};

  function renderDocPreview(){
    const md=document.getElementById('app-doc').value;
    document.getElementById('doc-preview').innerHTML = md ? WispMD.render(md) : '<span class="muted">（暂无内容）</span>';
  }
  function switchDocTab(mode){
    const edit=mode==='edit';
    document.getElementById('app-doc').style.display=edit?'':'none';
    document.getElementById('doc-preview').style.display=edit?'none':'';
    document.getElementById('doc-tab-edit').classList.toggle('active',edit);
    document.getElementById('doc-tab-preview').classList.toggle('active',!edit);
    if(!edit) renderDocPreview();
  }

  function showAlert(m,t){const a=document.getElementById('alert');a.className='alert show '+(t||'err');a.textContent=m;a.scrollIntoView({behavior:'smooth',block:'center'});}
  function hideAlert(){document.getElementById('alert').className='alert';}
  function goStep(n){
    [1,2,3].forEach(i=>{ document.getElementById('panel-'+i).style.display = i===n?'':'none'; });
    document.querySelectorAll('#steps .step').forEach(s=>{
      const v=+s.dataset.s; s.classList.toggle('active',v===n); s.classList.toggle('done',v<n);
    });
    hideAlert(); window.scrollTo({top:0,behavior:'smooth'});
  }
  function backTo(n){goStep(n);}
  function busy(id,on){const b=document.getElementById(id);if(on){b.dataset.t=b.innerHTML;b.insertAdjacentHTML('beforeend',' <span class="spinner"></span>');b.disabled=true;}else{if(b.dataset.t)b.innerHTML=b.dataset.t;b.disabled=false;}}

  async function genDoc(){
    const input=document.getElementById('req-input').value.trim();
    if(!input){showAlert('请先描述你的需求');return;}
    busy('btn-gen-doc',true);
    try{
      const vo=await A.genRequirement(input); // {appId, content}
      state.appId=vo.appId;
      document.getElementById('app-doc').value=vo.content||'';
      document.getElementById('appid-badge').textContent='appId: '+(vo.appId??'—');
      renderDocPreview(); switchDocTab('preview');
      goStep(2);
    }catch(e){ showAlert(e.needAuth?'登录失效，请重新登录':('生成文档失败：'+e.message)); }
    busy('btn-gen-doc',false);
  }

  async function genApp(){
    const appDoc=document.getElementById('app-doc').value.trim();
    if(!appDoc){showAlert('应用文档不能为空');return;}
    if(!state.appId){showAlert('缺少 appId，请回到第一步重新生成文档');return;}
    const mode=document.querySelector('input[name=mode]:checked').value;
    busy('btn-gen-app',true);
    try{
      const ret = mode==='agent' ? await A.genAppAgent(state.appId,appDoc) : await A.genApp(state.appId,appDoc);
      state.appId=ret.appId??state.appId; state.previewUrl=ret.previewUrl; state.appType=ret.appType;
      renderResult(mode);
      goStep(3);
    }catch(e){ showAlert(e.needAuth?'登录失效，请重新登录':('生成应用失败：'+e.message)); }
    busy('btn-gen-app',false);
  }

  function renderResult(mode){
    const url=WispAPI.fmtUrl(state.previewUrl);
    document.getElementById('result-kv').innerHTML=
      '<div class="k">应用 ID</div><div class="v mono">#'+esc(state.appId)+'</div>'+
      '<div class="k">构建方式</div><div class="v">'+(mode==='agent'?'多 Agent':'普通')+'</div>'+
      '<div class="k">应用类型</div><div class="v">'+esc(WispAPI.appTypeLabel(state.appType))+'</div>'+
      '<div class="k">预览链接</div><div class="v">'+(url?`<a href="${esc(url)}" target="_blank" rel="noopener">${esc(state.previewUrl)}</a>`:'<span class="muted">无</span>')+'</div>';
    document.getElementById('preview').src = url || 'about:blank';
    document.getElementById('open-tab').href = url || '#';
    document.getElementById('to-detail').href = 'app.html?appId='+encodeURIComponent(state.appId);
  }

  function resetAll(){ state={appId:null,previewUrl:null,appType:null}; document.getElementById('req-input').value=''; document.getElementById('app-doc').value=''; document.getElementById('doc-preview').innerHTML=''; document.getElementById('preview').src='about:blank'; switchDocTab('preview'); goStep(1); }
</script>
</body>
</html>
