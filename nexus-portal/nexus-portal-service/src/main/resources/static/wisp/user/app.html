<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>应用详情 · WispCode</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div id="nav-mount"></div>
<div class="wrap wide">
  <div class="page-title" id="title">应用详情</div>
  <p class="page-sub"><a href="apps.html">← 我的应用</a></p>
  <div id="alert" class="alert"></div>

  <div class="grid cols-2">
    <!-- left -->
    <div>
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
          <div><h3 id="app-name" style="margin:0">加载中…</h3>
            <div id="app-meta" class="meta" style="margin-top:8px"></div></div>
          <button class="btn ok" id="btn-deploy" onclick="toggleDeploy()">部署</button>
        </div>
        <hr class="sep">
        <label>预览</label>
        <div class="row" style="margin-bottom:10px">
          <input class="input mono" id="preview-url" readonly placeholder="暂无预览链接">
          <a class="btn ghost sm" id="open-tab" href="#" target="_blank" rel="noopener" style="flex:0 0 auto">↗</a>
          <button class="btn ghost sm" onclick="reloadPreview()" style="flex:0 0 auto">刷新</button>
        </div>
        <iframe id="preview" class="preview-frame" src="about:blank"></iframe>
      </div>

      <div class="card">
        <h3>应用文档</h3>
        <p class="hint">用于构建的需求文档内容。</p>
        <div class="doc-box" id="app-doc">—</div>
        <div id="app-desc" class="muted" style="margin-top:10px;font-size:13px"></div>
      </div>
    </div>

    <!-- right: chat history + natural language edit -->
    <div>
      <div class="card">
        <h3>💬 对话与修改记录</h3>
        <p class="hint">用户（左）与大模型（右）的交互历史。</p>
        <div class="chat" id="chat"><div class="muted loading-inline"><span class="spinner"></span> 加载历史…</div></div>
      </div>

      <div class="card">
        <h3>🪄 自然语言修改</h3>
        <p class="hint">描述你想改什么，AI 会重新生成应用并给出新预览链接。</p>
        <div class="field"><textarea id="edit-prompt" placeholder="例如：把主题色改成深色，并给列表加上搜索框"></textarea></div>
        <button class="btn block" id="btn-edit" onclick="doEdit()">应用修改</button>
      </div>
    </div>
  </div>
</div>

<script src="assets/api.js"></script>
<script>
  const A=WispAPI.api,Auth=WispAPI.auth,nav=WispAPI.nav,esc=WispAPI.escape;
  if(!Auth.require()){} nav('apps');
  const appId=new URLSearchParams(location.search).get('appId');
  let deployed=false;
  if(!appId){ document.getElementById('title').textContent='未指定应用'; }

  function showAlert(m,t){const a=document.getElementById('alert');a.className='alert show '+(t||'err');a.textContent=m;window.scrollTo({top:0,behavior:'smooth'});}
  function hideAlert(){document.getElementById('alert').className='alert';}
  function busy(id,on){const b=document.getElementById(id);if(on){b.dataset.t=b.innerHTML;b.insertAdjacentHTML('beforeend',' <span class="spinner"></span>');b.disabled=true;}else{if(b.dataset.t)b.innerHTML=b.dataset.t;b.disabled=false;}}

  async function loadDetail(){
    try{
      const d=await A.detail(appId);
      if(!d){showAlert('应用不存在或无权访问');return;}
      document.getElementById('app-name').textContent=d.appName||('应用 #'+d.id);
      document.title=(d.appName||'应用')+' · WispCode';
      deployed=!!d.deploy;
      document.getElementById('app-meta').innerHTML=
        '<span class="badge">#'+esc(d.id)+'</span>'+WispAPI.appTypeBadge(d.appType)+
        '<span class="badge '+(deployed?'on':'off')+'">'+(deployed?'已部署':'未部署')+'</span>'+
        (d.userId?'<span class="badge">owner: '+esc(d.userId)+'</span>':'');
      const url=WispAPI.fmtUrl(d.previewUrl);
      document.getElementById('preview-url').value=d.previewUrl||'';
      document.getElementById('open-tab').href=url||'#';
      document.getElementById('preview').src=url||'about:blank';
      document.getElementById('app-doc').textContent=d.appDoc||'—';
      document.getElementById('app-desc').textContent=d.appDesc?('简介：'+d.appDesc):'';
      renderDeployBtn();
    }catch(e){ showAlert(e.message); }
  }
  function renderDeployBtn(){
    const b=document.getElementById('btn-deploy');
    b.className='btn '+(deployed?'danger':'ok');
    b.innerHTML=deployed?'⏹ 取消部署':'▶ 部署';
  }
  async function toggleDeploy(){
    Auth.require();
    busy('btn-deploy',true);
    try{
      const r= deployed ? await A.deployCancel(appId) : await A.deploy(appId);
      if(r && r.success===false){ showAlert(r.errMsg||'操作失败'); }
      else{ deployed=!deployed; toastX((deployed?'部署成功':'已取消部署'),'ok'); loadDetail(); }
    }catch(e){ if(e.needAuth){Auth.expired(e.message);return;} showAlert(e.message); }
    busy('btn-deploy',false);
  }
  function toastX(m,t){WispAPI.toast(m,t);}

  function reloadPreview(){ const u=document.getElementById('preview').src; document.getElementById('preview').src='about:blank'; setTimeout(()=>document.getElementById('preview').src=u,80); }

  async function loadHistory(){
    try{
      const list=await A.history(appId);
      const el=document.getElementById('chat');
      if(!list||!list.length){ el.innerHTML='<div class="empty">暂无对话记录</div>'; return; }
      el.innerHTML=list.map(m=>{
        const user=m.msgRole===0;
        return `<div class="msg ${user?'user':'ai'}">${user?'':'<span class="ava">🤖</span>'}<div class="bubble">${esc(m.content)}</div>${user?'<span class="ava">🧑</span>':''}</div>`;
      }).join('');
      el.scrollTop=el.scrollHeight;
    }catch(e){ document.getElementById('chat').innerHTML='<div class="alert err show">'+esc(e.message)+'</div>'; }
  }

  async function doEdit(){
    Auth.require();
    const p=document.getElementById('edit-prompt').value.trim();
    if(!p){showAlert('请输入修改描述');return;}
    busy('btn-edit',true); hideAlert();
    try{
      const ret=await A.editApp(appId,p);
      const url=WispAPI.fmtUrl(ret.previewUrl);
      if(ret.previewUrl){document.getElementById('preview-url').value=ret.previewUrl;document.getElementById('open-tab').href=url;document.getElementById('preview').src=url;}
      if(ret.appType){/* refresh meta softly */}
      document.getElementById('edit-prompt').value='';
      WispAPI.toast('修改完成，已更新预览','ok');
      loadHistory(); loadDetail();
    }catch(e){ if(e.needAuth){Auth.expired(e.message);return;} showAlert('修改失败：'+e.message); }
    busy('btn-edit',false);
  }

  if(appId){ loadDetail(); loadHistory(); }
</script>
</body>
</html>
