<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>应用详情 · WispCode</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('wisp_theme')==='light'?'light':'dark'}catch(e){}</script>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div id="nav-mount"></div>
<div class="wrap wide">
  <div class="page-title" id="title">应用详情</div>
  <p class="page-sub"><a href="apps.html"><svg class="ic" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg> 我的应用</a></p>
  <div id="alert" class="alert"></div>

  <div class="card">
    <div class="card-head app-head">
      <div><h3 id="app-name">加载中…</h3>
        <div id="app-meta" class="meta"></div></div>
      <div class="app-head-actions">
        <button class="btn ghost" id="btn-vs" onclick="openVsCode()"><svg class="ic" viewBox="0 0 24 24"><path d="m10 13-2 2 2 2M14 11l2-2-2-2M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/></svg>VSCode 代码预览</button>
        <button class="btn" id="btn-confirm" onclick="doVsConfirm()"><svg class="ic" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>确认更改</button>
        <button class="btn ok" id="btn-deploy" onclick="toggleDeploy()">部署</button>
      </div>
    </div>
    <hr class="sep">
    <label>预览链接</label>
    <div class="row">
      <input class="input mono" id="preview-url" readonly placeholder="暂无预览链接">
      <a class="btn ghost sm" id="open-tab" href="#" target="_blank" rel="noopener"><svg class="ic" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/></svg>新标签打开</a>
    </div>
  </div>

  <div class="grid cols-2 mt-16">
    <!-- left: 应用文档 -->
    <div class="card">
      <h3><svg class="ic" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>应用文档</h3>
      <p class="hint">用于构建的需求文档内容。</p>
      <div class="md-tabs">
        <button class="active" id="doc-tab-render" onclick="showDoc('render')">渲染</button>
        <button id="doc-tab-raw" onclick="showDoc('raw')">原文</button>
      </div>
      <div class="md-body" id="app-doc"></div>
      <div class="doc-box" id="app-doc-raw" style="display:none">—</div>
      <div id="app-desc" class="muted app-desc"></div>
    </div>

    <!-- right: chat history + natural language edit -->
    <div>
      <div class="card">
        <h3><svg class="ic" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/></svg>对话与修改记录</h3>
        <p class="hint">用户（右）与大模型（左）的交互历史。</p>
        <div class="chat" id="chat"><div class="muted loading-inline"><span class="spinner"></span> 加载历史…</div></div>
      </div>

      <div class="card">
        <h3><svg class="ic" viewBox="0 0 24 24"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/></svg>自然语言修改</h3>
        <p class="hint">描述你想改什么，AI 会重新生成应用并给出新预览链接。</p>
        <div class="field"><textarea id="edit-prompt" placeholder="例如：把主题色改成深色，并给列表加上搜索框"></textarea></div>
        <button class="btn block" id="btn-edit" onclick="doEdit()">应用修改</button>
      </div>
    </div>
  </div>
</div>

<script src="assets/markdown.js"></script>
<script src="assets/api.js"></script>
<script>
  const A=WispAPI.api,Auth=WispAPI.auth,nav=WispAPI.nav,esc=WispAPI.escape;
  if(!Auth.require()){} nav('apps');
  const appId=new URLSearchParams(location.search).get('appId');
  let deployed=false;
  let rawDoc='';
  if(!appId){ document.getElementById('title').textContent='未指定应用'; }

  function showDoc(mode){
    const r=mode==='render';
    document.getElementById('app-doc').style.display=r?'':'none';
    document.getElementById('app-doc-raw').style.display=r?'none':'';
    document.getElementById('doc-tab-render').classList.toggle('active',r);
    document.getElementById('doc-tab-raw').classList.toggle('active',!r);
  }

  function showAlert(m,t){const a=document.getElementById('alert');a.className='alert show '+(t||'err');a.textContent=m;window.scrollTo({top:0,behavior:'smooth'});}
  function hideAlert(){document.getElementById('alert').className='alert';}
  function busy(id,on){const b=document.getElementById(id);if(on){b.dataset.t=b.innerHTML;b.insertAdjacentHTML('beforeend',' <span class="spinner"></span>');b.disabled=true;}else{if(b.dataset.t)b.innerHTML=b.dataset.t;b.disabled=false;}}

  async function loadDetail(){
    try{
      const d=await A.detail(appId);
      if(!d){showAlert('应用不存在或无权访问');return;}
      document.getElementById('app-name').textContent=d.appName||('应用 #'+d.id);
      document.title=(d.appName||'应用')+' · WispCode';
      deployed=!!d.deploy;
      document.getElementById('app-meta').innerHTML=
        '<span class="badge">#'+esc(d.id)+'</span>'+WispAPI.appTypeBadge(d.appType)+
        '<span class="badge '+(deployed?'on':'off')+'">'+(deployed?'已部署':'未部署')+'</span>'+
        (d.username?'<span class="badge">👤 '+esc(d.username)+'</span>':'');
      const url=WispAPI.fmtUrl(d.previewUrl);
      document.getElementById('preview-url').value=d.previewUrl||'';
      document.getElementById('open-tab').href=url||'#';
      rawDoc = d.appDoc || '';
      document.getElementById('app-doc-raw').textContent = rawDoc || '—';
      document.getElementById('app-doc').innerHTML = rawDoc ? WispMD.render(rawDoc) : '<span class="muted">—</span>';
      document.getElementById('app-desc').textContent=d.appDesc?('简介：'+d.appDesc):'';
      renderDeployBtn();
    }catch(e){ showAlert(e.message); }
  }
  function renderDeployBtn(){
    const b=document.getElementById('btn-deploy');
    b.className='btn '+(deployed?'danger':'ok');
    b.innerHTML=deployed?'⏹ 取消部署':'▶ 部署';
  }
  async function toggleDeploy(){
    Auth.require();
    busy('btn-deploy',true);
    try{
      const r= deployed ? await A.deployCancel(appId) : await A.deploy(appId);
      if(r && r.success===false){ showAlert(r.errMsg||'操作失败'); }
      else{ deployed=!deployed; toastX((deployed?'部署成功':'取消部署成功'),'ok'); loadDetail(); }
    }catch(e){ if(e.needAuth){Auth.expired(e.message);return;} showAlert(e.message); }
    busy('btn-deploy',false);
  }
  function toastX(m,t){WispAPI.toast(m,t);}

  async function openVsCode(){
    Auth.require();
    busy('btn-vs',true);
    try{
      const url=await A.vsUrl(appId);
      if(url){ window.open(url,'_blank','noopener'); }
      else{ WispAPI.toast('您无权限修改','err'); }
    }catch(e){
      if(e.needAuth){Auth.expired(e.message);busy('btn-vs',false);return;}
      WispAPI.toast('您无权限修改','err');
    }
    busy('btn-vs',false);
  }

  let lastVsConfirm=0; // 「确认更改」上次点击时间戳，用于 10s 冷却
  async function doVsConfirm(){
    Auth.require();
    const now=Date.now();
    if(now-lastVsConfirm<10000){ WispAPI.toast('操作过于频繁，请 10 秒后再试','err'); return; }
    lastVsConfirm=now;
    busy('btn-confirm',true);
    try{
      const ok=await A.vsConfirm(appId);
      if(ok===false){ WispAPI.toast('确认更改失败','err'); }
      else{ WispAPI.toast('已确认更改','ok'); loadDetail(); loadHistory(); }
    }catch(e){
      if(e.needAuth){Auth.expired(e.message);busy('btn-confirm',false);return;}
      WispAPI.toast('确认更改失败：'+e.message,'err');
    }
    busy('btn-confirm',false);
  }

  async function loadHistory(){
    try{
      const list=await A.history(appId);
      const el=document.getElementById('chat');
      if(!list||!list.length){ el.innerHTML='<div class="empty">暂无对话记录</div>'; return; }
      el.innerHTML=list.map(m=>{
        const user=m.msgRole===0;
        return `<div class="msg ${user?'user':'ai'}">${user?'':'<span class="ava">🤖</span>'}<div class="bubble">${esc(m.content)}</div>${user?'<span class="ava">🧑</span>':''}</div>`;
      }).join('');
      el.scrollTop=el.scrollHeight;
    }catch(e){ document.getElementById('chat').innerHTML='<div class="alert err show">'+esc(e.message)+'</div>'; }
  }

  async function doEdit(){
    Auth.require();
    const p=document.getElementById('edit-prompt').value.trim();
    if(!p){showAlert('请输入修改描述');return;}
    busy('btn-edit',true); hideAlert();
    try{
      const ret=await A.editApp(appId,p);
      const url=WispAPI.fmtUrl(ret.previewUrl);
      if(ret.previewUrl){document.getElementById('preview-url').value=ret.previewUrl;document.getElementById('open-tab').href=url;}
      if(ret.appType){/* refresh meta softly */}
      document.getElementById('edit-prompt').value='';
      WispAPI.toast('修改完成，已更新预览','ok');
      loadHistory(); loadDetail();
    }catch(e){ if(e.needAuth){Auth.expired(e.message);return;} showAlert('修改失败：'+e.message); }
    busy('btn-edit',false);
  }

  if(appId){ loadDetail(); loadHistory(); }
</script>
</body>
</html>
