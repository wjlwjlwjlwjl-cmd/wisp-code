<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>个人中心 · WispCode</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('wisp_theme')==='light'?'light':'dark'}catch(e){}</script>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div id="nav-mount"></div>
<div class="wrap">
  <div class="page-title">个人中心</div>
  <div id="alert" class="alert"></div>

  <div class="card">
    <div class="profile-id">
      <div class="avatar lg" id="avatar">?</div>
      <div><h3 id="p-name">加载中…</h3><div class="muted" id="p-email">—</div></div>
    </div>
    <hr class="sep">
    <div class="kv" id="kv"></div>
    <hr class="sep">
    <div class="profile-actions">
      <button class="btn ghost" onclick="load()"><svg class="ic" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>刷新</button>
      <a class="btn" href="apps.html"><svg class="ic" viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>我的应用</a>
      <button class="btn danger" onclick="WispAPI.auth.logout()"><svg class="ic" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>退出登录</button>
    </div>
  </div>
</div>

<script src="assets/api.js"></script>
<script>
  const A=WispAPI.api,Auth=WispAPI.auth,nav=WispAPI.nav,esc=WispAPI.escape;
  if(!Auth.require()){} nav('profile');
  function showAlert(m,t){const a=document.getElementById('alert');a.className='alert show '+(t||'err');a.textContent=m;}
  function hideAlert(){document.getElementById('alert').className='alert';}
  async function load(){
    hideAlert();
    try{
      const u=await A.getInfo();
      Auth.setUser(u);
      const name=u.username||u.email||'用户';
      document.getElementById('p-name').textContent=name;
      document.getElementById('p-email').textContent=u.email||'—';
      document.getElementById('avatar').textContent=name.slice(0,1).toUpperCase();
      document.getElementById('kv').innerHTML=
        '<div class="k">用户名</div><div class="v">'+esc(u.username||'—')+'</div>'+
        '<div class="k">邮箱</div><div class="v">'+esc(u.email||'—')+'</div>';
    }catch(e){
      if(e.needAuth){Auth.expired(e.message);return;}
      showAlert('获取用户信息失败：'+e.message);
    }
  }
  load();
</script>
</body>
</html>
